name: CD Production

on:
  workflow_run:
    workflows:
      - "CI Tests"
      - "Lint Check"
      - "Test Check"
    types:
      - completed

jobs:

  deploy:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      actions: read
      contents: read

    steps:

      # ============================================================
      # 1. Verify all 3 workflows passed for the SAME commit
      # ============================================================

      - name: Verify CI, Lint and Test
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          SHA="${{ github.event.workflow_run.head_sha }}"
          REPO="${{ github.repository }}"

          echo "=========================================="
          echo "Checking commit"
          echo "$SHA"
          echo "=========================================="

          get_status() {

            gh run list \
              --repo "$REPO" \
              --workflow "$1" \
              --commit "$SHA" \
              --limit 1 \
              --json status,conclusion \
              --jq '
                if length == 0
                then "missing"
                elif .[0].status != "completed"
                then "running"
                else .[0].conclusion
                end
              '
          }

          CI_STATUS=$(get_status "CI Tests")
          LINT_STATUS=$(get_status "Lint Check")
          TEST_STATUS=$(get_status "Test Check")

          echo ""
          echo "CI Tests:   $CI_STATUS"
          echo "Lint Check: $LINT_STATUS"
          echo "Test Check: $TEST_STATUS"
          echo ""

          if [ "$CI_STATUS" != "success" ]; then
            echo "CI Tests did not pass."
            exit 1
          fi

          if [ "$LINT_STATUS" != "success" ]; then
            echo "Lint Check did not pass."
            exit 1
          fi

          if [ "$TEST_STATUS" != "success" ]; then
            echo "Test Check did not pass."
            exit 1
          fi

          echo "=========================================="
          echo "ALL 3 CHECKS PASSED"
          echo "=========================================="


      # ============================================================
      # 2. Checkout exact commit
      # ============================================================

      - name: Checkout exact commit
        uses: actions/checkout@v4

        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      # ============================================================
      # 3. Login Docker Hub
      # ============================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ============================================================
      # 4. Build Docker image
      # ============================================================

      - name: Build Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SHA: ${{ github.event.workflow_run.head_sha }}

        run: |

          IMAGE="$DOCKERHUB_USERNAME/funtush-api"

          echo "Building Docker image:"
          echo "$IMAGE:$SHA"

          docker build \
            -t "$IMAGE:$SHA" \
            -t "$IMAGE:latest" \
            .


      # ============================================================
      # 5. Push Docker image to Docker Hub
      # ============================================================

      - name: Push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SHA: ${{ github.event.workflow_run.head_sha }}

        run: |

          IMAGE="$DOCKERHUB_USERNAME/funtush-api"

          echo "Pushing:"
          echo "$IMAGE:$SHA"

          docker push "$IMAGE:$SHA"

          echo "Pushing latest..."

          docker push "$IMAGE:latest"


      # ============================================================
      # 6. Setup SSH
      # ============================================================

      - name: Setup SSH
        run: |

          mkdir -p ~/.ssh

          chmod 700 ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H \
            "${{ secrets.SERVER_HOST }}" \
            >> ~/.ssh/known_hosts


      # ============================================================
      # 7. Deploy to VPS
      # ============================================================

      - name: Deploy to VPS
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/funtush-api
          SHA: ${{ github.event.workflow_run.head_sha }}

        run: |

          ssh \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "IMAGE='$IMAGE' SHA='$SHA' bash -s" <<'EOF'

          set -e

          APP_DIR="/home/rituraj/app/funtush"
          CONTAINER_NAME="funtush-api"

          cd "$APP_DIR"

          echo ""
          echo "=========================================="
          echo "FUNTUSH PRODUCTION DEPLOYMENT"
          echo "=========================================="

          echo ""
          echo "New image:"
          echo "$IMAGE:$SHA"


          # ======================================================
          # SAVE CURRENT IMAGE
          # ======================================================

          echo ""
          echo "Saving currently running image..."

          CURRENT_IMAGE=$(docker inspect \
            -f '{{.Config.Image}}' \
            "$CONTAINER_NAME" \
            2>/dev/null || true)

          echo "Previous image:"
          echo "${CURRENT_IMAGE:-none}"

          if [ -n "$CURRENT_IMAGE" ]; then
            echo "$CURRENT_IMAGE" > .previous-image
          fi


          # ======================================================
          # PULL NEW IMAGE
          # ======================================================

          echo ""
          echo "Pulling new image..."

          docker pull "$IMAGE:$SHA"


          # ======================================================
          # DEPLOY ONLY API
          # ======================================================

          echo ""
          echo "Deploying API..."

          export FUNTUSH_API_IMAGE="$IMAGE:$SHA"

          docker compose up \
            -d \
            --no-deps \
            api


          # ======================================================
          # WAIT
          # ======================================================

          echo ""
          echo "Waiting for application..."

          sleep 10


          # ======================================================
          # HEALTH CHECK
          # ======================================================

          echo ""
          echo "Running health check..."

          if curl \
            --fail \
            --silent \
            --show-error \
            http://localhost:4000/health
          then

            echo ""
            echo "=========================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

            echo ""
            echo "Running image:"

            docker inspect \
              -f '{{.Config.Image}}' \
              "$CONTAINER_NAME"

            exit 0

          fi


          # ======================================================
          # HEALTH CHECK FAILED
          # ======================================================

          echo ""
          echo "=========================================="
          echo "HEALTH CHECK FAILED"
          echo "=========================================="

          echo ""
          echo "Recent API logs:"

          docker logs \
            --tail 100 \
            "$CONTAINER_NAME" || true


          # ======================================================
          # STOP FAILED API
          # ======================================================

          echo ""
          echo "Stopping failed API..."

          docker compose stop api || true

          docker compose rm \
            -f \
            api || true


          # ======================================================
          # ROLLBACK
          # ======================================================

          if [ -n "$CURRENT_IMAGE" ]; then

            echo ""
            echo "=========================================="
            echo "ROLLING BACK"
            echo "=========================================="

            echo "Previous image:"
            echo "$CURRENT_IMAGE"


            # Pull previous image if it is from Docker Hub
            docker pull "$CURRENT_IMAGE"


            # Tell Compose to use previous image
            export FUNTUSH_API_IMAGE="$CURRENT_IMAGE"


            # Start previous API
            docker compose up \
              -d \
              --no-deps \
              api


            echo ""
            echo "Waiting for rollback..."

            sleep 10


            # ==================================================
            # ROLLBACK HEALTH CHECK
            # ==================================================

            echo ""
            echo "Checking rollback health..."

            if curl \
              --fail \
              --silent \
              --show-error \
              http://localhost:4000/health
            then

              echo ""
              echo "=========================================="
              echo "ROLLBACK SUCCESSFUL"
              echo "=========================================="

              echo ""
              echo "Running image:"

              docker inspect \
                -f '{{.Config.Image}}' \
                "$CONTAINER_NAME"

              exit 1

            else

              echo ""
              echo "=========================================="
              echo "ROLLBACK FAILED"
              echo "=========================================="

              docker logs \
                --tail 100 \
                "$CONTAINER_NAME" || true

              exit 1

            fi

          else

            echo ""
            echo "=========================================="
            echo "NO PREVIOUS IMAGE FOUND"
            echo "=========================================="

            exit 1

          fi

          EOF
